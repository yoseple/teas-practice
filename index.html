<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TEAS 7 Practice Exams</title>
<meta name="description" content="Three free TEAS 7 practice exams (183 original questions) with timed sections, explanations, saved progress, and weak-topic practice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a calm exam console — one column on phones, passage beside question on wide screens. */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --ink:#14262b; --muted:#56696d; --line:#d3dfdc;
  --accent:#0b6e68; --accent-soft:#e1f0ed; --flag:#a85a06; --flag-soft:#fbefdc;
  --good:#17703a; --good-soft:#e2f3e7; --bad:#b42323; --bad-soft:#fbe7e7;
  --f-display:"Literata", Georgia, "Times New Roman", serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e191b; --surface:#152326; --ink:#e2edeb; --muted:#93a8aa; --line:#27393c;
  --accent:#55c4b7; --accent-soft:#183a38; --flag:#f0a33a; --flag-soft:#3a2a12;
  --good:#5fd68a; --good-soft:#163222; --bad:#f58080; --bad-soft:#3a1a1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e191b; --surface:#152326; --ink:#e2edeb; --muted:#93a8aa; --line:#27393c;
  --accent:#55c4b7; --accent-soft:#183a38; --flag:#f0a33a; --flag-soft:#3a2a12;
  --good:#5fd68a; --good-soft:#163222; --bad:#f58080; --bad-soft:#3a1a1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 64px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}
h1{font-size:2rem;font-weight:700}
h2{font-size:1.35rem;font-weight:600}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;min-height:44px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:700}
button.ghost{background:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px}
.intro{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:start;margin-top:16px}
@media (max-width:820px){.intro{grid-template-columns:1fr}}
.lede{font-size:1.08rem;max-width:62ch}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:.9rem}
tr.area td{font-weight:700;background:var(--accent-soft)}
.tablebox{overflow-x:auto}
.settabs{display:flex;gap:8px;flex-wrap:wrap}
.settabs button{font-family:var(--f-display);font-weight:600;font-size:1.05rem;min-width:110px}
.settabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sections{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.sections{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.sections{grid-template-columns:1fr}}
.sec{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border-radius:10px}
.sec b{font-family:var(--f-display);font-size:1.1rem}
.sec .meta{font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sec .last{font-size:.82rem;color:var(--accent);font-weight:700}
.toggle{display:flex;align-items:center;gap:10px;font-size:.95rem}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.sources li{margin-bottom:8px}
.sources a{color:var(--accent)}
.note{font-size:.9rem;border-left:3px solid var(--flag);padding:8px 12px;background:var(--flag-soft);border-radius:0 8px 8px 0}

/* exam */
.examhead{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;margin-bottom:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.examhead .row{justify-content:space-between}
.timer{font-family:var(--f-mono);font-size:1.15rem;padding:6px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad);border-color:var(--bad)}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
@media (max-width:600px){
  .grid{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
  .grid button{flex:none}
  .examhead h2{font-size:1.1rem}
  .calc{width:200px;padding:10px}
  .calc .keys button{min-height:36px}
}
.qtext:focus{outline:none}
.qtext:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.grid button{min-width:40px;min-height:36px;padding:4px 8px;font-family:var(--f-mono);font-size:.85rem}
.grid button.answered{background:var(--accent-soft);border-color:var(--accent)}
.grid button.flagged{box-shadow:inset 0 -4px 0 var(--flag)}
.grid button.current{outline:2px solid var(--ink);outline-offset:1px}
.qlayout{display:grid;grid-template-columns:minmax(0,1fr);gap:20px}
.qlayout.with-passage{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
@media (max-width:860px){.qlayout.with-passage{grid-template-columns:1fr}}
.passage{font-family:var(--f-display);font-size:1rem;line-height:1.7;max-height:70vh;overflow:auto}
.passage p+p{margin-top:12px}
.passage table{font-family:var(--f-body)}
.passage ol{padding-left:22px;margin:0}
.qtext{font-size:1.08rem}
.qtype{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px}
.opt .key{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.opt.ms .key{border-radius:6px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .key{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.numin{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numin input{font:inherit;font-family:var(--f-mono);font-size:1.1rem;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:180px;max-width:100%}
.ord{display:flex;flex-direction:column;gap:8px}
.orditem{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.orditem .pos{font-family:var(--f-mono);color:var(--muted);width:20px}
.orditem .txt{flex:1;min-width:0}
.orditem button{min-height:36px;min-width:40px;padding:4px 8px}
/* hot spot */
.hotwords{font-family:var(--f-display);font-size:1.2rem;line-height:2.4;padding:16px;border:1px dashed var(--line);border-radius:10px;background:var(--surface)}
.hotwords button{font:inherit;padding:2px 6px;min-height:0;border:1px solid transparent;background:transparent;border-radius:6px}
.hotwords button:hover{border-color:var(--accent)}
.hotwords button.sel{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.hotbars{display:flex;align-items:flex-end;gap:10px;height:240px;padding:16px 12px 0;border:1px dashed var(--line);border-radius:10px;background:var(--surface);overflow-x:auto}
.hotbar{flex:1;min-width:48px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.hotbar button{width:100%;padding:0;min-height:0;border-radius:6px 6px 0 0;background:var(--accent);opacity:.55;border:2px solid transparent}
.hotbar button:hover{opacity:.8}
.hotbar button.sel{opacity:1;border-color:var(--ink)}
.hotbar .val{font-family:var(--f-mono);font-size:.8rem}
.hotbar .lab{font-size:.82rem;color:var(--muted);padding-bottom:8px;white-space:nowrap}
.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:8px}
.flagbtn.on{background:var(--flag-soft);border-color:var(--flag);color:var(--flag);font-weight:700}

/* calculator */
.calc{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;width:240px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.calc .disp{font-family:var(--f-mono);font-size:1.4rem;text-align:right;padding:8px;border-radius:6px;background:var(--bg);margin-bottom:8px;overflow:hidden;text-overflow:ellipsis}
.calc .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc .keys button{padding:6px;min-height:42px;font-family:var(--f-mono)}
.calc .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700;font-size:.9rem}
.calc .head button{min-height:30px;padding:2px 10px}

/* results */
.scorecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.score{padding:16px}
.score .big{font-family:var(--f-mono);font-size:1.9rem}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:4px}
.bar span{display:block;height:100%;background:var(--accent)}
.rev{border-left:4px solid var(--line);padding:12px 16px;background:var(--surface);border-radius:0 10px 10px 0}
.rev.ok{border-left-color:var(--good)}
.rev.no{border-left-color:var(--bad)}
.rev .tag{font-weight:700;font-size:.8rem;letter-spacing:.05em;text-transform:uppercase}
.rev.ok .tag{color:var(--good)} .rev.no .tag{color:var(--bad)}
.rev .exp{margin-top:8px;padding:10px 12px;background:var(--bg);border-radius:8px;font-size:.95rem}
.filter{display:flex;gap:8px;flex-wrap:wrap}
.filter button.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.opt,.grid button,button{transition:background .12s,border-color .12s}}

/* page base (GitHub Pages has no wrapper) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--bad-soft);color:var(--bad);font-size:.88rem;font-weight:700}
button.danger{background:var(--bad);border-color:var(--bad);color:var(--bg);font-weight:700}
details summary{cursor:pointer;font-weight:700;padding:6px 0}
details summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.resume{margin-top:16px;border-color:var(--accent);background:var(--accent-soft)}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
(function(){
"use strict";

/* ---------- Official TEAS 7 blueprint (ATI content outline) ---------- */
const BLUEPRINT = [
  {area:"Reading", n:39, pct:"26%", time:"55 min", items:"45 items", subs:[["Key Ideas and Details",15],["Craft and Structure",9],["Integration of Knowledge and Ideas",15]]},
  {area:"Math", n:34, pct:"23%", time:"57 min", items:"38 items", subs:[["Number and Algebra",18],["Measurement and Data",16]]},
  {area:"Science", n:44, pct:"29%", time:"60 min", items:"50 items", subs:[["Human Anatomy and Physiology",18],["Biology",9],["Chemistry",8],["Scientific Reasoning",9]]},
  {area:"English and Language Usage", n:33, pct:"22%", time:"37 min", items:"37 items", subs:[["Conventions of Standard English",12],["Knowledge of Language",11],["Using Language and Vocabulary",10]]}
];
const SECTIONS = {
  R:{name:"Reading", minutes:20},
  M:{name:"Math", minutes:21},
  S:{name:"Science", minutes:22},
  E:{name:"English & Language Usage", minutes:13}
};
const ORDER = ["R","M","S","E"];
const SETS = ["A","B","C"];

/* ---------- Passages (shared pool, keyed per set) ---------- */
const P = {
  /* Set A */
  semm:{title:"Passage: Handwashing in Vienna", html:`<p>In 1847, Ignaz Semmelweis, a physician at Vienna General Hospital, noticed something troubling. Women who gave birth in the ward staffed by doctors and medical students died of childbed fever far more often than women in the ward staffed by midwives. The doctors and students often came to the ward directly from performing autopsies.</p><p>Semmelweis required staff to wash their hands in a chlorinated lime solution before examining patients. Deaths in the doctors' ward dropped sharply.</p><p>Yet many of his colleagues rejected his findings. Germ theory had not yet been established, and some physicians were offended by the suggestion that their own hands could carry disease. Semmelweis died in 1865, years before the work of Louis Pasteur and Joseph Lister helped convince the medical community that he had been right.</p>`},
  shifts:{title:"Passage: Opinion column", html:`<p>Hospitals that schedule nurses for twelve-hour shifts are making a mistake. Several studies have linked shifts of twelve hours or longer to higher rates of nurse burnout and patient-care errors.</p><p>Supporters of long shifts argue that fewer handoffs between nurses mean fewer chances for important information to be lost. That argument is unconvincing. Any nurse who has struggled through the eleventh hour of a hectic shift knows that a tired mind makes mistakes.</p><p>Hospitals should cap shifts at eight hours, and they should do it now.</p>`},
  rx:{title:"Prescription label", html:`<p><b>Take 1 tablet by mouth every 8 hours for 10 days.</b></p><p>Scheduled times: 6:00 a.m., 2:00 p.m., 10:00 p.m.</p><p>Do not take with dairy products.</p><p>If you miss a dose, take it as soon as you remember. If it is within 2 hours of your next scheduled dose, skip the missed dose and take the next dose at the regular time. Do not take two doses at once.</p>`},
  dressing:{title:"Passage: Changing a simple dressing", html:`<p>To change a simple dressing, the nurse begins by performing hand hygiene and explaining the procedure to the patient. Wearing clean gloves, the nurse removes the old dressing and discards it along with the gloves.</p><p>Before the new dressing is applied, the nurse performs hand hygiene again and opens the sterile supplies. Only after the supplies are open does the nurse put on sterile gloves and apply the new dressing.</p>`},
  flu:{title:"Table: Flu vaccines given at a community clinic", html:`<div class="tablebox"><table><thead><tr><th>Month</th><th class="n">Vaccines given</th></tr></thead><tbody><tr><td>September</td><td class="n">120</td></tr><tr><td>October</td><td class="n">310</td></tr><tr><td>November</td><td class="n">260</td></tr><tr><td>December</td><td class="n">140</td></tr></tbody></table></div>`},
  gardens:{title:"Two short texts on city gardens", html:`<p><b>Text 1.</b> Community gardens turn empty city lots into sources of fresh vegetables. In neighborhoods where grocery stores are scarce, a shared garden can put tomatoes and greens within walking distance. Gardeners also report getting to know neighbors they had never spoken to before.</p><p><b>Text 2.</b> City gardens offer real benefits, from fresh produce to time outdoors. However, soil in older urban areas can contain lead from old paint and past industrial use. Before planting food crops, gardeners should have the soil tested or grow vegetables in raised beds filled with clean soil.</p>`},
  label:{title:"Soup label and a dietary guideline", html:`<div class="tablebox"><table><tbody><tr><td>Serving size</td><td class="n">1 cup</td></tr><tr><td>Servings per container</td><td class="n">2.5</td></tr><tr><td>Sodium per serving</td><td class="n">480 mg</td></tr></tbody></table></div><p style="margin-top:12px"><i>Guideline:</i> Adults should limit sodium to less than 2,300 mg per day.</p>`},
  clinic:{title:"Patients seen at a clinic", html:`<div class="tablebox"><table><thead><tr><th>Day</th><th class="n">Patients</th></tr></thead><tbody><tr><td>Monday</td><td class="n">32</td></tr><tr><td>Tuesday</td><td class="n">28</td></tr><tr><td>Wednesday</td><td class="n">35</td></tr><tr><td>Thursday</td><td class="n">30</td></tr><tr><td>Friday</td><td class="n">25</td></tr></tbody></table></div>`},
  para:{title:"Paragraph", html:`<p>(1) Regular physical activity offers benefits for both body and mind. (2) Exercise strengthens the heart and helps control blood pressure. (3) It also releases chemicals in the brain that can improve mood. (4) The first modern Olympic Games were held in Athens in 1896. (5) Even a brisk 30-minute walk most days of the week can make a difference.</p>`},

  /* Set B */
  night:{title:"Passage: Florence Nightingale", html:`<p>When Florence Nightingale arrived at the British army hospital at Scutari in 1854, during the Crimean War, she found crowded wards, poor ventilation, and contaminated water. She and the nurses who came with her cleaned the wards, organized supplies, and improved the soldiers' food and laundry.</p><p>Nightingale also kept careful records. She used them to create diagrams showing that far more soldiers were dying from diseases that could be prevented than from wounds suffered in battle. Her charts helped persuade government officials to support sanitary reforms in military hospitals.</p><p>In 1860, Nightingale founded a training school for nurses at St Thomas' Hospital in London. Its graduates carried her methods to hospitals around the world.</p>`},
  urine:{title:"Instructions: Clean-catch urine sample", html:`<ol><li>Wash your hands with soap and water.</li><li>Open the sterile cup without touching the inside of the cup or lid.</li><li>Clean the genital area with the towelette provided.</li><li>Begin urinating into the toilet.</li><li>Without stopping the stream, move the cup into the stream and collect 1 to 2 ounces of urine.</li><li>Finish urinating into the toilet.</li><li>Place the lid on the cup and give the cup to the nurse.</li></ol>`},
  soda:{title:"Passage: Letter to the school board", html:`<p>Our district should remove sugary drinks from school vending machines. One 20-ounce bottle of regular soda can contain more than 60 grams of sugar. Students who drink soda every day are building habits that may last a lifetime.</p><p>Some parents argue that students should be free to make their own choices. But a school is a place of learning, and what it sells sends a message about what is healthy.</p><p>Removing sugary drinks is the most responsible step the district can take.</p>`},
  tele:{title:"Two short texts on telehealth", html:`<p><b>Text 1.</b> Telehealth visits let patients talk with a provider by video from home. Patients in rural areas no longer need to drive for hours to reach a specialist, and working parents can fit a short appointment into a lunch break.</p><p><b>Text 2.</b> Telehealth can make care easier to reach, but it has limits. Some problems, such as listening to the lungs or examining a swollen joint, require a hands-on, in-person visit. In addition, not every household has a reliable internet connection.</p>`},
  bus:{title:"Clinic hours and bus schedule", html:`<p><b>Riverside Clinic hours</b><br>Monday–Friday: 8:00 a.m. – 5:00 p.m.<br>Saturday: 9:00 a.m. – 12:00 noon</p><p><b>Bus Route 12 (runs every day)</b><br>Leaves Elm Street every hour at 40 minutes past the hour, starting at 7:40 a.m. The ride to Riverside Clinic takes 25 minutes.</p><p><b>Clinic policy:</b> Arrive 15 minutes before your appointment time.</p>`},
  grades:{title:"Final grades in a class of 30 students", html:`<div class="tablebox"><table><thead><tr><th>Grade</th><th class="n">Students</th></tr></thead><tbody><tr><td>A</td><td class="n">6</td></tr><tr><td>B</td><td class="n">10</td></tr><tr><td>C</td><td class="n">8</td></tr><tr><td>D</td><td class="n">4</td></tr><tr><td>F</td><td class="n">2</td></tr></tbody></table></div>`},

  /* Set C */
  insulin:{title:"Passage: The discovery of insulin", html:`<p>Before 1922, a diagnosis of type 1 diabetes was usually a death sentence. Doctors could only prescribe strict, near-starvation diets that extended patients' lives by months.</p><p>In 1921, at the University of Toronto, surgeon Frederick Banting and his student assistant Charles Best began experiments to extract insulin from the pancreases of dogs. Biochemist James Collip later helped purify the extract. In January 1922, a teenage boy named Leonard Thompson became the first person to receive an insulin injection for diabetes. After he received a purified dose, his blood sugar fell and he regained strength.</p><p>In 1923, Banting and John Macleod, who directed the laboratory, received the Nobel Prize. Banting shared his prize money with Best, and Macleod shared his with Collip.</p>`},
  pets:{title:"Passage: Opinion column", html:`<p>Hospitals should welcome visits from patients' pets. Studies of animal-assisted therapy have found that time with animals can lower stress and anxiety in patients.</p><p>Critics worry about infections and allergies. These concerns are real, but they can be managed. Hospitals can require that animals be vaccinated, bathed, and screened before visits, and they can keep animals away from patients with weakened immune systems.</p><p>A wagging tail may be some of the best medicine a hospital can offer.</p>`},
  pain:{title:"Pain log for one patient (0 = no pain, 10 = worst pain)", html:`<div class="tablebox"><table><thead><tr><th>Time</th><th class="n">Pain score</th><th>Note</th></tr></thead><tbody><tr><td>8:00 a.m.</td><td class="n">7</td><td>Pain medication given</td></tr><tr><td>10:00 a.m.</td><td class="n">4</td><td></td></tr><tr><td>12:00 p.m.</td><td class="n">5</td><td></td></tr><tr><td>2:00 p.m.</td><td class="n">7</td><td>Pain medication given</td></tr><tr><td>4:00 p.m.</td><td class="n">3</td><td></td></tr></tbody></table></div>`},
  preop:{title:"Instructions before your procedure", html:`<ul style="padding-left:20px;margin:0"><li>Do not eat any solid food after midnight.</li><li>You may drink clear liquids, such as water, apple juice, or black coffee, until 6:00 a.m.</li><li>Take your blood pressure medicine at 6:00 a.m. with a small sip of water.</li><li>Do not take your diabetes medicine on the morning of the procedure.</li><li>Arrive at the surgery center by 7:30 a.m.</li></ul>`},
  books:{title:"Two short texts on reading", html:`<p><b>Text 1.</b> Many readers still prefer printed books. They enjoy the feel of paper and the smell of a new book, and some say it is easier to flip back to an earlier page.</p><p><b>Text 2.</b> E-readers offer advantages that printed books cannot. Readers can enlarge the text, look up a word with a single tap, and carry hundreds of books in a device lighter than a single paperback.</p>`},

 ans:1, exp:"dys- = difficult or painful; -phagia = eating or swallowing. Do not confuse it with dysphasia, a speech or language disorder."},
{set:"A",sec:"E",sub:"Using Language and Vocabulary",obj:"E.3.1",type:"ord",

 opts:["Prewriting (planning and brainstorming)","Drafting","Revising","Editing and proofreading","Publishing"],

{set:"B",sec:"R",sub:"Key Ideas and Details",obj:"R.1.4",type:"mc",passage:"night",

{set:"B",sec:"R",sub:"Key Ideas and Details",obj:"R.1.2",type:"mc",passage:"night",
 q:"Which of the following can be inferred about conditions at Scutari before Nightingale arrived?",
 opts:["They contributed to deaths from preventable diseases.","They were better than conditions in London hospitals.","They had no effect on the soldiers' health.","They were caused by Nightingale's nurses."],
 ans:0, exp:"Paragraph 1 describes crowded wards, poor ventilation, and contaminated water. Paragraph 2 reports that far more soldiers died of preventable disease than of wounds. Together these support the inference that the conditions contributed to those deaths. The other choices are not supported."},
{set:"B",sec:"R",sub:"Craft and Structure",obj:"R.2.3",type:"mc",passage:"night",

{set:"B",sec:"R",sub:"Craft and Structure",obj:"R.2.2",type:"mc",passage:"night",

{set:"B",sec:"R",sub:"Integration of Knowledge and Ideas",obj:"R.3.1",type:"mc",passage:"night",

{set:"B",sec:"R",sub:"Key Ideas and Details",obj:"R.1.3",type:"mc",passage:"urine",
 q:"A patient starts filling the cup as soon as urination begins. Which instruction did the patient fail to follow?",

{set:"B",sec:"R",sub:"Key Ideas and Details",obj:"R.1.6",type:"ord",passage:"urine",

 opts:["Clean the genital area with the towelette","Begin urinating into the toilet","Collect 1 to 2 ounces of urine in the cup","Place the lid on the cup"],

{set:"B",sec:"R",sub:"Key Ideas and Details",obj:"R.1.5",type:"hot",

 hot:{kind:"bars", labels:["Week 1","Week 2","Week 3","Week 4","Week 5"], values:[4200,5100,6800,6500,7900], max:8000},

{set:"B",sec:"R",sub:"Craft and Structure",obj:"R.2.1",type:"ms",passage:"soda",
 q:"Which of the following sentences from the letter are statements of <b>fact</b>? <b>Select all that apply.</b>",
 opts:["“Our district should remove sugary drinks from school vending machines.”","“One 20-ounce bottle of regular soda can contain more than 60 grams of sugar.”","“Some parents argue that students should be free to make their own choices.”","“Removing sugary drinks is the most responsible step the district can take.”"],
 ans:[1,2], exp:"Facts can be checked: the sugar content can be measured, and whether some parents make that argument can be verified. “Should” and “most responsible” express the author's judgment, so A and D are opinions."},
{set:"B",sec:"R",sub:"Craft and Structure",obj:"R.2.4",type:"mc",passage:"soda",
 q:"The author's attitude toward selling sugary drinks in schools is best described as:",

{set:"B",sec:"R",sub:"Integration of Knowledge and Ideas",obj:"R.3.3",type:"mc",passage:"soda",
 q:"How does the author respond to the parents who believe students should make their own choices?",
 opts:["The author ignores their view.","The author agrees with them completely.","The author acknowledges their view and then argues that schools send a message about health.","The author provides statistics that prove the parents wrong."],
 ans:2, exp:"The author states the counterargument (“Some parents argue…”) and then answers it with “But a school is a place of learning….” No statistics are used in that response."},
{set:"B",sec:"R",sub:"Integration of Knowledge and Ideas",obj:"R.3.3",type:"mc",passage:"soda",
 q:"Which finding, if true, would most <b>strengthen</b> the author's argument?",

{set:"B",sec:"R",sub:"Integration of Knowledge and Ideas",obj:"R.3.2",type:"mc",passage:"tele",
 q:"On which point do the two authors agree?",
 opts:["Telehealth should replace all in-person visits.","Telehealth can make care easier for some patients to reach.","Every household has a reliable internet connection.","Rural patients should move closer to specialists."],

{set:"B",sec:"R",sub:"Integration of Knowledge and Ideas",obj:"R.3.1",type:"mc",passage:"tele",
 q:"Based on Text 2, which patient most likely needs an in-person visit?",
 opts:["A patient who wants to ask about a prescription refill","A patient who needs to schedule a follow-up","A patient with a swollen, painful knee","A patient who wants to review blood-test results"],

{set:"B",sec:"R",sub:"Integration of Knowledge and Ideas",obj:"R.3.4",type:"mc",passage:"bus",
 q:"A patient has an appointment at 10:30 a.m. on Saturday. What is the <b>latest</b> bus the patient can take from Elm Street and still follow the clinic policy?",
 opts:["8:40 a.m.","9:40 a.m.","10:05 a.m.","10:40 a.m."],
 ans:1, exp:"The patient must arrive by 10:15 a.m. The 9:40 bus arrives at 10:05 a.m.; the next bus (10:40) arrives at 11:05. 8:40 also works but is not the latest, and no bus leaves at 10:05."},
/* Math */
{set:"B",sec:"M",sub:"Number and Algebra",obj:"M.1.1",type:"mc",
 q:"Which percent is equal to 0.045?",
 opts:["0.45%","4.5%","45%","450%"],
 ans:1, exp:"Multiply a decimal by 100 to get a percent: 0.045 × 100 = 4.5%."},
{set:"B",sec:"M",sub:"Number and Algebra",obj:"M.1.2",type:"num",
 q:"Evaluate: &nbsp;−3 − (−8) × 2",
 ans:13, unit:"", exp:"Multiply first: (−8) × 2 = −16. Then −3 − (−16) = −3 + 16 = 13."},
{set:"B",sec:"M",sub:"Number and Algebra",obj:"M.1.4",type:"num",
 q:"Solve for <i>x</i>: &nbsp;3(<i>x</i> − 4) = 2<i>x</i> + 5",
 ans:17, unit:"", exp:"Distribute: 3x − 12 = 2x + 5. Subtract 2x: x − 12 = 5. Add 12: x = 17."},
{set:"B",sec:"M",sub:"Number and Algebra",obj:"M.1.5",type:"num",
 q:"A nurse works three 12-hour shifts each week and earns $38 per hour. How much does the nurse earn in one week, in dollars?",
 ans:1368, unit:"$", exp:"Hours: 3 × 12 = 36. Pay: 36 × $38 = $1,368."},
{set:"B",sec:"M",sub:"Number and Algebra",obj:"M.1.7",type:"mc",
 q:"Which is the best estimate of 49.8 × 6.1?",
 opts:["30","300","360","3,000"],
 ans:1, exp:"Round to friendly numbers: 49.8 ≈ 50 and 6.1 ≈ 6. 50 × 6 = 300. (The exact answer is 303.78.)"},
{set:"B",sec:"M",sub:"Number and Algebra",obj:"M.1.9",type:"num",
 q:"An IV bag of 1,000 mL is to be infused over 8 hours. At what rate should it run, in mL per hour?",
 ans:125, unit:"mL/hr", exp:"Rate = total volume ÷ time = 1,000 mL ÷ 8 hr = 125 mL/hr."},
{set:"B",sec:"M",sub:"Number and Algebra",obj:"M.1.6",type:"mc",
 q:"The price of a textbook rose from $80 to $92. By what percent did the price increase?",
 opts:["12%","13%","15%","87%"],
 ans:2, exp:"Percent change = change ÷ original = 12 ÷ 80 = 0.15 = 15%. Choice B divides by the new price (12 ÷ 92 ≈ 13%), which is a common mistake."},
{set:"B",sec:"M",sub:"Measurement and Data",obj:"M.2.1",type:"mc",passage:"grades",
 q:"What percent of the class earned a B or higher?",
 opts:["33.3%","46.7%","53.3%","16%"],
 ans:2, exp:"B or higher means A or B: 6 + 10 = 16 students. 16 ÷ 30 ≈ 0.533 = 53.3%."},
{set:"B",sec:"M",sub:"Measurement and Data",obj:"M.2.2",type:"mc",
 q:"What is the mode of this data set? &nbsp;4, 8, 8, 2, 11, 4, 8",
 opts:["4","6.4","8","9"],
 ans:2, exp:"The mode is the value that appears most often. 8 appears three times; 4 appears twice. (The mean is about 6.4, from 45 ÷ 7, and the range is 11 − 2 = 9.)"},
{set:"B",sec:"M",sub:"Measurement and Data",obj:"M.2.3",type:"mc",
 q:"The total cost of a repair is given by <i>C</i> = 15<i>h</i> + 40, where <i>h</i> is the number of hours worked. Which is the dependent variable?",
 opts:["<i>h</i>","<i>C</i>","15","40"],
 ans:1, exp:"The cost depends on the number of hours, so C is the dependent variable and h is the independent variable. 15 and 40 are constants."},
{set:"B",sec:"M",sub:"Measurement and Data",obj:"M.2.4",type:"mc",
 q:"A circular rash has a diameter of 6 cm. What is its area? (Use π ≈ 3.14.)",
 opts:["9.42 cm²","18.84 cm²","28.26 cm²","113.04 cm²"],
 ans:2, exp:"Radius = 6 ÷ 2 = 3 cm. Area = πr² = 3.14 × 9 = 28.26 cm². 18.84 is the circumference, and 113.04 comes from using the diameter as the radius."},
{set:"B",sec:"M",sub:"Measurement and Data",obj:"M.2.4",type:"num",
 q:"A right triangle has legs of 6 cm and 8 cm. What is the length of the hypotenuse, in cm?",
 ans:10, unit:"cm", exp:"Use the Pythagorean theorem: a² + b² = c². 36 + 64 = 100, so c = √100 = 10 cm."},
{set:"B",sec:"M",sub:"Measurement and Data",obj:"M.2.5",type:"num",
 q:"A newborn is 20 inches long. What is the length in centimeters? (1 in = 2.54 cm)",
 ans:50.8, tol:0.01, unit:"cm", exp:"Multiply inches by 2.54: 20 × 2.54 = 50.8 cm."},
{set:"B",sec:"M",sub:"Measurement and Data",obj:"M.2.5",type:"num",
 q:"A dose is 0.25 g. How many milligrams is that?",
 ans:250, unit:"mg", exp:"1 g = 1,000 mg, so 0.25 × 1,000 = 250 mg. Moving from a larger unit to a smaller unit means multiplying."},

{set:"B",sec:"S",sub:"Human Anatomy and Physiology",obj:"S.1.12",type:"mc",

{set:"B",sec:"S",sub:"Human Anatomy and Physiology",obj:"S.1.6",type:"mc",
 q:"Which type of muscle tissue is both striated and involuntary?",

{set:"B",sec:"S",sub:"Human Anatomy and Physiology",obj:"S.1.8",type:"mc",
 q:"What is the outermost layer of the skin?",
 opts:["Dermis","Hypodermis","Epidermis","Endodermis"],

{set:"B",sec:"S",sub:"Human Anatomy and Physiology",obj:"S.1.10",type:"mc",
 q:"What is the functional unit of the kidney that filters blood and forms urine?",
 opts:["Neuron","Nephron","Alveolus","Ureter"],

{set:"B",sec:"S",sub:"Human Anatomy and Physiology",obj:"S.1.7",type:"mc",
 q:"Where does fertilization of an egg usually take place?",
 opts:["Ovary","Uterus","Fallopian (uterine) tube","Cervix"],
 ans:2, exp:"Fertilization usually happens in the fallopian tube. The fertilized egg then travels to the uterus to implant."},
{set:"B",sec:"S",sub:"Human Anatomy and Physiology",obj:"S.1.2",type:"mc",
 q:"Which muscle contracts and flattens to draw air into the lungs during inhalation?",
 opts:["Diaphragm","Biceps","Trapezius","Pectoralis major"],
 ans:0, exp:"When the diaphragm contracts and moves down, the chest cavity gets larger, pressure in the lungs drops, and air flows in."},
{set:"B",sec:"S",sub:"Human Anatomy and Physiology",obj:"S.1.3",type:"ms",
 q:"Which blood vessels carry oxygen-poor (deoxygenated) blood? <b>Select all that apply.</b>",
 opts:["Pulmonary arteries","Pulmonary veins","Superior and inferior venae cavae","Aorta"],
 ans:[0,2], exp:"The venae cavae bring oxygen-poor blood from the body to the heart, and the pulmonary arteries carry it to the lungs. The pulmonary veins and aorta carry oxygen-rich blood."},
{set:"B",sec:"S",sub:"Biology",obj:"S.2.1",type:"mc",
 q:"Which structure is found in plant cells but <b>not</b> in animal cells?",
 opts:["Cell wall","Cell membrane","Mitochondria","Ribosomes"],
 ans:0, exp:"Plant cells have a rigid cell wall (and chloroplasts). Both plant and animal cells have a cell membrane, mitochondria, and ribosomes."},
{set:"B",sec:"S",sub:"Biology",obj:"S.2.2",type:"mc",
 q:"Which sequence shows the usual flow of genetic information in a cell?",
 opts:["Protein → RNA → DNA","DNA → protein → RNA","DNA → RNA → protein","RNA → DNA → protein"],
 ans:2, exp:"DNA is transcribed into RNA, and RNA is translated into protein."},
{set:"B",sec:"S",sub:"Biology",obj:"S.2.3",type:"num",
 q:"Tall (T) is dominant over short (t). A Tt plant is crossed with a tt plant. What percent of the offspring are expected to be tall?",
 ans:50, unit:"%", exp:"The Punnett square gives Tt, Tt, tt, tt. Two of four are Tt (tall): 50%."},
{set:"B",sec:"S",sub:"Biology",obj:"S.2.5",type:"mc",
 q:"Which statement about viruses is accurate?",
 opts:["Viruses are killed by antibiotics.","Viruses must infect a host cell to reproduce.","Viruses are a type of bacteria.","Viruses have their own ribosomes."],
 ans:1, exp:"Viruses are not cells. They have no ribosomes and use a host cell's machinery to copy themselves. Antibiotics target bacteria, not viruses."},
{set:"B",sec:"S",sub:"Chemistry",obj:"S.3.3",type:"mc",
 q:"Which chemical equation is balanced?",
 opts:["H₂ + O₂ → H₂O","2H₂ + O₂ → 2H₂O","2H₂ + 2O₂ → 2H₂O","H₂ + 2O₂ → H₂O"],
 ans:1, exp:"In 2H₂ + O₂ → 2H₂O there are 4 H and 2 O atoms on each side. A balanced equation has the same number of each atom on both sides."},
{set:"B",sec:"S",sub:"Chemistry",obj:"S.3.4",type:"ms",
 q:"Which changes would usually <b>increase</b> the rate of a chemical reaction? <b>Select all that apply.</b>",
 opts:["Raising the temperature","Increasing the concentration of reactants","Adding a catalyst","Using larger chunks of a solid reactant instead of powder"],
 ans:[0,1,2], exp:"Higher temperature, higher concentration, and catalysts all speed up reactions. Larger chunks have less surface area than powder, which slows the reaction."},
{set:"B",sec:"S",sub:"Chemistry",obj:"S.3.5",type:"mc",
 q:"In a saltwater solution, which substance is the solvent?",
 opts:["Salt","Water","Both salt and water","Neither"],
 ans:1, exp:"The solvent is the substance that does the dissolving, usually present in the larger amount. Salt is the solute."},
{set:"B",sec:"S",sub:"Scientific Reasoning",obj:"S.4.1",type:"mc",
 q:"A student wants to measure the length of a leaf. Which unit is most appropriate?",
 opts:["Kilometers","Centimeters","Liters","Grams"],
 ans:1, exp:"A leaf is a few centimeters long. Kilometers are far too large, and liters and grams measure volume and mass, not length."},
{set:"B",sec:"S",sub:"Scientific Reasoning",obj:"S.4.3",type:"mc",
 q:"Air pressure decreases as altitude increases. A hiker climbs from 1,000 m to 3,000 m. What will the hiker most likely experience at the higher point?",
 opts:["Higher air pressure","Lower air pressure","The same air pressure","No air pressure"],
 ans:1, exp:"The relationship is inverse: as altitude goes up, air pressure goes down. Air pressure is lower at 3,000 m but not zero."},
{set:"B",sec:"S",sub:"Scientific Reasoning",obj:"S.4.2",type:"mc",
 q:"A study finds that people who carry lighters are more likely to develop lung cancer. What is the best explanation?",
 opts:["Lighters cause lung cancer.","A third factor, smoking, is linked to both carrying lighters and lung cancer.","The study proves that lung cancer causes people to carry lighters.","The results must be a measurement error."],
 ans:1, exp:"Correlation does not prove causation. Smoking is a confounding variable: smokers are more likely to carry lighters and more likely to develop lung cancer."},
{set:"B",sec:"S",sub:"Scientific Reasoning",obj:"S.4.4",type:"mc",
 q:"In the scientific method, what step comes immediately after forming a hypothesis?",
 opts:["Asking a question","Testing the hypothesis with an experiment","Publishing the results","Drawing a conclusion"],
 ans:1, exp:"The usual order is: observe and ask a question, form a hypothesis, test it with an experiment, analyze the data, and draw a conclusion."},
/* English */
{set:"B",sec:"E",sub:"Conventions of Standard English",obj:"E.1.1",type:"hot",
 q:"<b>Click the misspelled word</b> in the sentence.",
 hot:{kind:"words", tokens:["The","pharmacist","will","recieve","the","new","shipment","of","medication","on","Tuesday."]},
 ans:3, exp:"The correct spelling is “receive.” The rule “i before e, except after c” applies here: c-e-i."},
{set:"B",sec:"E",sub:"Conventions of Standard English",obj:"E.1.2",type:"mc",
 q:"Which sentence uses commas correctly?",
 opts:["The kit contains, gauze, tape, and scissors.","The kit contains gauze, tape, and scissors.","The kit, contains gauze tape and scissors.","The kit contains gauze tape, and, scissors."],
 ans:1, exp:"Commas separate items in a series. No comma belongs between a subject and its verb (kit, contains), between a verb and its object (contains, gauze), or after the conjunction “and.”"},
{set:"B",sec:"E",sub:"Conventions of Standard English",obj:"E.1.3",type:"mc",
 q:"Which of the following is a sentence fragment?",
 opts:["The patient was allergic to penicillin.","Because the patient was allergic to penicillin.","The nurse checked the chart before giving the medicine.","The doctor arrived early, so the clinic opened on time."],
 ans:1, exp:"“Because” makes the clause dependent, so it cannot stand alone. It needs an independent clause, such as “…, the doctor ordered a different antibiotic.”"},
{set:"B",sec:"E",sub:"Conventions of Standard English",obj:"E.1.2",type:"mc",
 q:"Which sentence uses quotation marks and punctuation correctly?",
 opts:["The nurse asked, “Are you feeling dizzy”?","The nurse asked “are you feeling dizzy?”","The nurse asked, “Are you feeling dizzy?”","The nurse asked, Are you feeling dizzy?"],
 ans:2, exp:"Put a comma before the quotation, capitalize the first word of the quoted sentence, and place the question mark inside the closing quotation mark when the quoted words are the question."},
{set:"B",sec:"E",sub:"Conventions of Standard English",obj:"E.1.1",type:"mc",
 q:"Which sentence uses capitalization correctly?",
 opts:["Last Summer, my aunt visited Lake Michigan with Dr. Patel.","Last summer, my Aunt visited Lake Michigan with dr. Patel.","Last summer, my aunt visited Lake Michigan with Dr. Patel.","Last summer, my aunt visited lake Michigan with Dr. Patel."],
 ans:2, exp:"Seasons are not capitalized, family words are lowercase after “my,” and both words of a proper place name (Lake Michigan) and a title before a name (Dr.) are capitalized."},
{set:"B",sec:"E",sub:"Knowledge of Language",obj:"E.2.1",type:"mc",
 q:"Which word correctly completes the sentence? <br><i>Yesterday, the nurse ____ the patient's vital signs and recorded them.</i>",
 opts:["checks","checked","will check","is checking"],
 ans:1, exp:"“Yesterday” and “recorded” both point to the past, so the verb must also be past tense: “checked.”"},
{set:"B",sec:"E",sub:"Knowledge of Language",obj:"E.2.2",type:"mc",
 q:"A nurse is explaining a procedure to a patient with no medical background. Which sentence is most appropriate?",
 opts:["We will initiate peripheral IV access for isotonic fluid administration.","We will place a small tube in a vein in your arm to give you fluids.","IV goes in now.","Peripheral cannulation is indicated."],
 ans:1, exp:"Language for a general audience should be clear and complete and should avoid medical jargon."},
{set:"B",sec:"E",sub:"Knowledge of Language",obj:"E.2.3",type:"mc",
 q:"Which transition best connects the two sentences? <br><i>The patient received pain medication. ____, the patient's pain score dropped from 8 to 3.</i>",
 opts:["However","In contrast","As a result","For example"],
 ans:2, exp:"The second sentence describes an effect of the first, so a cause-and-effect transition fits. “However” and “In contrast” signal opposition."},
{set:"B",sec:"E",sub:"Knowledge of Language",obj:"E.2.1",type:"mc",
 q:"Which revision makes this sentence clear? <br><i>When Maria handed the chart to Jen, she smiled.</i>",
 opts:["When she handed the chart to Jen, she smiled.","Maria smiled when she handed the chart to Jen.","When Maria handed the chart to Jen, they smiled.","She smiled when she handed the chart."],
 ans:1, exp:"In the original, “she” could mean Maria or Jen. Choice B makes clear that Maria smiled."},
{set:"B",sec:"E",sub:"Using Language and Vocabulary",obj:"E.3.2",type:"mc",
 q:"Using word parts, what does <i>nephritis</i> mean?",
 opts:["Removal of a kidney","Inflammation of the kidney","Kidney stone","Enlarged kidney"],
 ans:1, exp:"nephr- = kidney; -itis = inflammation."},
{set:"B",sec:"E",sub:"Using Language and Vocabulary",obj:"E.3.2",type:"mc",
 q:"The prefix <i>hyper-</i> in <i>hypertension</i> means:",
 opts:["below normal","above normal or excessive","around","without"],
 ans:1, exp:"hyper- = above or excessive, so hypertension is high blood pressure. hypo- means below, peri- means around, and a- means without."},
{set:"B",sec:"E",sub:"Using Language and Vocabulary",obj:"E.3.2",type:"mc",
 q:"The suffix <i>-ectomy</i> in <i>appendectomy</i> means:",
 opts:["surgical removal","inflammation","study of","visual examination"],
 ans:0, exp:"-ectomy = surgical removal. Compare -itis (inflammation), -logy (study of), and -scopy (visual examination)."},
{set:"B",sec:"E",sub:"Using Language and Vocabulary",obj:"E.3.1",type:"mc",
 q:"Which sentence is the best thesis statement for an essay about hand hygiene in hospitals?",
 opts:["This essay is about washing hands.","Do you wash your hands?","Consistent hand hygiene is one of the most effective ways to prevent infections from spreading in hospitals.","Some people wash their hands and some do not."],
 ans:2, exp:"A thesis states the essay's main claim clearly and specifically. Announcements (A), questions (B), and vague observations (D) are not thesis statements."},

{set:"C",sec:"R",sub:"Key Ideas and Details",obj:"R.1.1",type:"mc",passage:"insulin",

function hashStr(s){let h=5381;for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))|0}return (h>>>0).toString(36)}
Q.forEach(q=>{q.id=q.set+q.sec+"-"+hashStr(q.q+"|"+JSON.stringify(q.opts||q.hot||q.ans))});
const BYID={}; Q.forEach(q=>{BYID[q.id]=q});
const topicKey=q=>q.sec+"|"+q.sub;
const topicName=k=>{const [sec,sub]=k.split("|");return {sec,sub,label:sub+" ("+SECTIONS[sec].name+")"}};

/* ---------- Saved data (this browser only) ---------- */
const KEY_HIST="teas7_history_v1", KEY_RUN="teas7_run_v1", KEY_SET="teas7_set";
function store(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
function load(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
function drop(k){try{localStorage.removeItem(k)}catch(e){}}
function hist(){
  const h=load(KEY_HIST); const out={attempts:[],latest:{},lastSec:{}};
  if(!h||typeof h!=="object") return out;
  if(Array.isArray(h.attempts)) out.attempts=h.attempts.filter(a=>a&&typeof a==="object"&&Number.isFinite(a.c)&&Number.isFinite(a.n)&&a.n>0);
  if(h.latest&&typeof h.latest==="object") for(const id in h.latest){const v=h.latest[id]; if(v&&typeof v==="object") out.latest[id]={ok:v.ok?1:0,t:Number(v.t)||0}}
  if(h.lastSec&&typeof h.lastSec==="object") for(const k in h.lastSec){const v=Number(h.lastSec[k]); if(Number.isFinite(v)) out.lastSec[k]=Math.round(v)}
  return out;
}

  const a=S.answers[q.id];
  if(a===undefined||a===null) return false;
  if(q.type==="ms") return a.length>0;
  if(q.type==="num") return String(a).trim()!=="";
  if(q.type==="ord") return a.touched===true;
  return true;
}
function parseNum(v){const n=parseFloat(String(v).replace(/[$,%\s]/g,"").replace(/[a-zA-Z/]+$/,""));return isNaN(n)?null:n}
function isCorrect(q){
  const a=S.answers[q.id];
  if(!isAnswered(q)) return false;
  if(q.type==="mc"||q.type==="hot") return a===q.ans;
  if(q.type==="ms"){const x=[...a].sort().join(),y=[...q.ans].sort().join();return x===y}
  if(q.type==="num"){const n=parseNum(a);return n!==null&&Math.abs(n-q.ans)<=(q.tol||0.001)}
  if(q.type==="ord") return a.order.every((v,i)=>v===i);
  return false;
}
function hotLabel(q,i){return q.hot.kind==="words"?q.hot.tokens[i].replace(/[.,]$/,""):q.hot.labels[i]}
function answerText(q,correct){
  const L="ABCDEF";
  if(correct){
    if(q.type==="mc") return L[q.ans]+". "+strip(q.opts[q.ans]);
    if(q.type==="hot") return hotLabel(q,q.ans);
    if(q.type==="ms") return q.ans.map(i=>L[i]+". "+strip(q.opts[i])).join("; ");
    if(q.type==="num") return (q.unit==="$"?"$":"")+q.ans+(q.unit&&q.unit!=="$"?" "+q.unit:"");
    if(q.type==="ord") return q.opts.map((o,i)=>(i+1)+". "+strip(o)).join("  →  ");
  }
  const a=S.answers[q.id];
  if(!isAnswered(q)) return "No answer";
  if(q.type==="mc") return L[a]+". "+strip(q.opts[a]);
  if(q.type==="hot") return hotLabel(q,a);
  if(q.type==="ms") return [...a].sort().map(i=>L[i]+". "+strip(q.opts[i])).join("; ");
  if(q.type==="num") return String(a);
  if(q.type==="ord") return a.order.map((v,i)=>(i+1)+". "+strip(q.opts[v])).join("  →  ");
}

/* ---------- Progress and weak topics ---------- */
function mastery(){
  const h=hist(), t={};
  for(const id in h.latest){const q=BYID[id]; if(!q) continue; const k=topicKey(q); t[k]=t[k]||{c:0,n:0}; t[k].n++; t[k].c+=h.latest[id].ok?1:0}
  return t;
}
function weakTopics(){
  const m=mastery();
  const rows=Object.entries(m).map(([k,v])=>({k,c:v.c,n:v.n,p:v.c/v.n})).sort((a,b)=>a.p-b.p||b.n-a.n);
  const below=rows.filter(r=>r.p<0.8);
  return {topics:(below.length?below:rows).slice(0,3), allStrong:rows.length>0&&!below.length, rows};
}
function buildWeakIds(){
  const {topics}=weakTopics(); if(!topics.length) return [];
  const h=hist(); const per=Math.ceil(20/topics.length); let ids=[];
  topics.forEach(t=>{
    const pool=Q.filter(q=>topicKey(q)===t.k).map(q=>{const l=h.latest[q.id];return {q,rank:l?(l.ok?2:0):1,r:Math.random()}});
    pool.sort((a,b)=>a.rank-b.rank||a.r-b.r);
    ids=ids.concat(pool.slice(0,per).map(x=>x.q));
  });
  ids.sort((a,b)=>ORDER.indexOf(a.sec)-ORDER.indexOf(b.sec)||a.sub.localeCompare(b.sub)||String(a.passage||"").localeCompare(String(b.passage||"")));
  return ids.map(q=>q.id);
}

/* ---------- Runs ---------- */
function validRun(r){
  try{return !!(r&&r.run&&typeof r.run.label==="string"&&Array.isArray(r.run.sections)&&r.run.sections.length
    &&Number.isInteger(r.qi)&&r.qi>=0&&r.qi<r.run.sections.length
    &&Number.isFinite(r.left)&&(r.answers==null||typeof r.answers==="object")
    &&r.run.sections.every(s=>s&&typeof s.name==="string"&&Number.isFinite(s.minutes)&&Array.isArray(s.ids)&&s.ids.length&&s.ids.every(id=>BYID[id])))}catch(e){return false}
}
function saveRun(){
  if(!S.run||(S.view!=="exam"&&S.view!=="break")) return;
  store(KEY_RUN,{run:S.run,qi:S.qi,idx:S.idx,answers:S.answers,flags:S.flags,left:S.left,used:S.used,timed:S.timed,view:S.view,breakLeft:S.breakLeft});
}
function initRun(run){
  S.run=run; S.qi=0; S.answers={}; S.flags={}; S.used={}; S.filter="all";
  runQuestions().filter(q=>q.type==="ord").forEach(q=>{S.answers[q.id]={order:[...q.start],touched:false}});
  beginSection();
}
function startExam(which){
  const t=document.getElementById("timedToggle"); if(t) S.timed=t.checked;
  const keys=which==="FULL"?[...ORDER]:[which];
  initRun({kind:which==="FULL"?"exam":"section", set:S.set,
    label:which==="FULL"?`Exam ${S.set}`:`Exam ${S.set}: ${SECTIONS[which].name}`,
    sections:keys.map(k=>({key:k,name:SECTIONS[k].name,minutes:SECTIONS[k].minutes,ids:Q.filter(q=>q.set===S.set&&q.sec===k).map(q=>q.id)}))});
}
function startWeak(){
  const t=document.getElementById("timedToggle"); if(t) S.timed=t.checked;
  const ids=buildWeakIds(); if(!ids.length) return;
  initRun({kind:"weak", set:null, label:"Weak-topic practice", sections:[{key:"W",name:"Weak-topic practice",minutes:Math.ceil(ids.length*1.2),ids}]});
}
function resumeRun(){
  const r=load(KEY_RUN); if(!validRun(r)){drop(KEY_RUN);renderHome();return}
  const maxIdx=r.run.sections[r.qi].ids.length-1;
  S.run=r.run; S.qi=r.qi; S.idx=Number.isInteger(r.idx)?Math.max(0,Math.min(r.idx,maxIdx)):0; S.answers=r.answers||{}; S.flags=(r.flags&&typeof r.flags==="object")?r.flags:{};
  S.left=r.left; S.used=(r.used&&typeof r.used==="object")?r.used:{}; S.timed=!!r.timed; S.breakLeft=Number.isFinite(r.breakLeft)?r.breakLeft:0; S.filter="all"; S.calcOpen=false;
  runQuestions().forEach(q=>{
    const a=S.answers[q.id];
    if(q.type==="ord"){const ok=a&&Array.isArray(a.order)&&a.order.length===q.opts.length&&[...a.order].sort().join()===q.opts.map((_,i)=>i).join(); if(!ok) S.answers[q.id]={order:[...q.start],touched:false}}
    else if(q.type==="ms"&&a!=null&&!Array.isArray(a)) delete S.answers[q.id];
    else if((q.type==="mc"||q.type==="hot")&&a!=null&&!Number.isInteger(a)) delete S.answers[q.id];
    else if(q.type==="num"&&a!=null&&typeof a!=="string") delete S.answers[q.id];
  });
  if(r.view==="break"){S.view="break"; startTimer(); renderBreak(); return}
  S.view="exam"; startTimer(); renderExam(); window.scrollTo(0,0);
}
function beginSection(){
  S.view="exam"; S.idx=0; S.calcOpen=false;
  S.left=secObj().minutes*60; S.used[S.qi]=0;
  startTimer(); renderExam(); window.scrollTo(0,0);
}
function startTimer(){
  stopTimer();
  S.timer=setInterval(()=>{
    if(S.view==="exam"){
      S.used[S.qi]=(S.used[S.qi]||0)+1;
      if(S.timed){S.left--; if(S.left<=0){finishSection();return}}
      const el=document.getElementById("timer"); if(el) updateTimerEl(el);
      saveRun();
    } else if(S.view==="break"){
      S.breakLeft--; const el=document.getElementById("breakTimer"); if(el) el.textContent=fmt(S.breakLeft);
      saveRun();
      if(S.breakLeft<=0){S.qi++; beginSection();}
    }
  },1000);
}
function stopTimer(){if(S.timer){clearInterval(S.timer);S.timer=null}}
function updateTimerEl(el){
  if(S.timed){el.textContent=fmt(S.left)+" left"; el.classList.toggle("low",S.left<=120)}
  else el.textContent=fmt(S.used[S.qi]||0)+" elapsed";

function refreshGridOnly(){

  document.querySelectorAll("[data-go]").forEach(b=>{const x=list[+b.dataset.go];b.classList.toggle("answered",isAnswered(x))});
  const p=document.getElementById("progressLine"); const fc=flaggedCount(list);
  if(p) p.textContent=`${list.filter(isAnswered).length} of ${list.length} answered${fc?` · ${fc} flagged`:""} · your place is saved automatically`;
}
function askFinish(){
  const list=curList(); const un=list.filter(x=>!isAnswered(x)).length; const fc=flaggedCount(list);
  const box=document.getElementById("confirmBox");
  box.innerHTML=`<div class="panel stack" style="border-color:var(--flag)"><p><b>Finish ${esc(secObj().name)}?</b> ${un?`${un} question${un>1?"s are":" is"} unanswered. There is no penalty for guessing, so answer every question.`:"All questions answered."}${fc?` You have ${fc} flagged question${fc>1?"s":""} to review.`:""} You cannot return to this section after finishing it.</p><div class="row"><button class="primary" id="confirmFinish">Finish section</button><button id="cancelFinish">Keep working</button></div></div>`;
  box.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function finishSection(){
  const sec=secObj(); const list=curList(); const now=Date.now();
  const h=hist();
  list.forEach(q=>{h.latest[q.id]={ok:isCorrect(q)?1:0,t:now}});
  if(S.run.kind!=="weak") h.lastSec[S.run.set+sec.key]=Math.round(100*list.filter(isCorrect).length/list.length);
  const last=S.qi>=S.run.sections.length-1;
  if(last){
    const all=runQuestions(); const c=all.filter(isCorrect).length;
    h.attempts.push({t:now,label:S.run.label,kind:S.run.kind,c,n:all.length});
    if(h.attempts.length>100) h.attempts=h.attempts.slice(-100);
  }
  store(KEY_HIST,h);
  if(!last){
    if(sec.key==="M"&&S.run.kind==="exam"){S.view="break"; S.breakLeft=600; renderBreak(); saveRun(); return}
    S.qi++; beginSection();
  } else {stopTimer(); drop(KEY_RUN); S.view="results"; renderResults(); window.scrollTo(0,0)}
}
function renderBreak(){
  app.innerHTML=`<div class="panel stack" style="max-width:560px;margin:40px auto;text-align:center"><span class="eyebrow">Optional break</span><h1 id="breakTimer">${fmt(S.breakLeft)}</h1><p class="muted">The real TEAS gives a 10-minute break between Math and Science. The exam clock is paused. Science starts automatically when the break ends.</p><button class="primary" id="endBreak">Continue to Science</button></div>`;
}

/* ---------- Calculator ---------- */
function renderCalc(){
  const k=["7","8","9","÷","4","5","6","×","1","2","3","−","0",".","=","+"];
  return `<div class="calc" role="dialog" aria-label="Calculator"><div class="head"><span>Calculator</span><button id="calcClose">Close</button></div><div class="disp" id="calcDisp">${esc(calc.disp)}</div><div class="keys">${k.map(x=>`<button data-ck="${x}">${x}</button>`).join("")}<button data-ck="C" style="grid-column:span 2">Clear</button><button data-ck="⌫" style="grid-column:span 2">⌫</button></div></div>`;
}
function calcPress(k){
  const ops={"+":(a,b)=>a+b,"−":(a,b)=>a-b,"×":(a,b)=>a*b,"÷":(a,b)=>b===0?NaN:a/b};
  const fix=n=>isFinite(n)?String(Math.round(n*1e10)/1e10):"Error";
  if(/[0-9]/.test(k)){calc.disp=(calc.fresh||calc.disp==="0"||calc.disp==="Error")?k:calc.disp+k; calc.fresh=false}
  else if(k==="."){if(calc.fresh||calc.disp==="Error"){calc.disp="0.";calc.fresh=false}else if(!calc.disp.includes("."))calc.disp+="."}
  else if(k==="C"){calc.disp="0";calc.acc=null;calc.op=null;calc.fresh=true}
  else if(k==="⌫"){if(!calc.fresh){calc.disp=calc.disp.length>1?calc.disp.slice(0,-1):"0"}}
  else if(ops[k]){const cur=parseFloat(calc.disp); if(calc.op&&!calc.fresh){calc.disp=fix(ops[calc.op](calc.acc,cur))} calc.acc=parseFloat(calc.disp); calc.op=k; calc.fresh=true}
  else if(k==="="){if(calc.op){calc.disp=fix(ops[calc.op](calc.acc,parseFloat(calc.disp)));calc.op=null;calc.acc=null;calc.fresh=true}}
  const d=document.getElementById("calcDisp"); if(d) d.textContent=calc.disp;
}

/* ---------- Results ---------- */
function renderResults(){
  const all=runQuestions();
  const tot=all.filter(isCorrect).length;
  const cards=S.run.sections.map((s,i)=>{const l=s.ids.map(id=>BYID[id]);const c=l.filter(isCorrect).length;const p=Math.round(100*c/l.length);return `<div class="panel score"><span class="eyebrow">${esc(s.name)}</span><div class="big">${p}%</div><div class="muted" style="font-variant-numeric:tabular-nums">${c} of ${l.length} correct · ${fmt(S.used[i]||0)}</div><div class="bar"><span style="width:${p}%"></span></div></div>`}).join("");
  const subs={}; all.forEach(q=>{const key=topicKey(q);subs[key]=subs[key]||{sec:q.sec,sub:q.sub,c:0,n:0};subs[key].n++;if(isCorrect(q))subs[key].c++});
  const subRows=Object.values(subs).map(s=>{const p=Math.round(100*s.c/s.n);return `<tr><td>${SECTIONS[s.sec].name}</td><td>${s.sub}</td><td class="n">${s.c}/${s.n}</td><td class="n">${p}%</td><td style="width:30%"><div class="bar"><span style="width:${p}%;${p<60?"background:var(--bad)":""}"></span></div></td></tr>`}).join("");
  const weak=Object.values(subs).filter(s=>s.c/s.n<0.6).map(s=>s.sub);
  const shown=all.filter(q=>S.filter==="all"||(S.filter==="wrong"&&!isCorrect(q))||(S.filter==="flag"&&S.flags[q.id]));
  const rev=shown.map(q=>{const ok=isCorrect(q);const n=all.indexOf(q)+1;return `<div class="rev ${ok?"ok":"no"} stack" style="gap:6px"><div class="row" style="justify-content:space-between"><span class="tag">${ok?"Correct":"Incorrect"}${S.flags[q.id]?" · flagged":""}</span><span class="muted" style="font-size:.85rem">#${n} · ${SECTIONS[q.sec].name} · ${q.sub} · ${q.obj} · Exam ${q.set}</span></div>${q.passage?`<div class="muted" style="font-size:.85rem">Uses: ${P[q.passage].title}</div>`:""}<div>${q.q}</div><div style="font-size:.95rem"><b>Your answer:</b> ${esc(answerText(q,false))}</div>${ok?"":`<div style="font-size:.95rem"><b>Correct answer:</b> ${esc(answerText(q,true))}</div>`}<div class="exp">${q.exp}</div></div>`}).join("")||`<p class="muted">Nothing to show for this filter.</p>`;
  app.innerHTML=`
  <div class="stack">
    <span class="eyebrow">${esc(S.run.label)} results · saved to your progress</span>
    <h1>${tot} of ${all.length} correct (${Math.round(100*tot/all.length)}%)</h1>
    <p class="muted">This is a raw percent, not ATI's adjusted individual total score. ${weak.length?`Focus your next study session on: <b>${weak.join(", ")}</b>.`:"No weak areas below 60% this time."}</p>
    <div class="scorecards">${cards}</div>
    <div class="panel"><h2 style="margin-bottom:10px">By topic</h2><div class="tablebox"><table><thead><tr><th>Section</th><th>Topic</th><th class="n">Score</th><th class="n">%</th><th></th></tr></thead><tbody>${subRows}</tbody></table></div></div>
    <div class="row" style="justify-content:space-between"><h2>Review every answer</h2><div class="filter"><button data-filter="all" class="${S.filter==="all"?"on":""}">All</button><button data-filter="wrong" class="${S.filter==="wrong"?"on":""}">Incorrect only</button><button data-filter="flag" class="${S.filter==="flag"?"on":""}">Flagged</button></div></div>
    <div class="stack">${rev}</div>
    <div class="row"><button class="primary" id="homeBtn">Back to start</button></div>
  </div>`;
}

/* ---------- Events ---------- */
app.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(S.view==="home"){
    if(t.dataset.set){S.set=t.dataset.set; store(KEY_SET,S.set); S.confirmReset=false; renderHome(); return}
    if(t.dataset.start){startExam(t.dataset.start);return}
    switch(t.id){
      case "weakBtn": startWeak(); return;
      case "resumeBtn": resumeRun(); return;
      case "discardBtn": drop(KEY_RUN); renderHome(); return;
      case "resetBtn": S.confirmReset=true; renderHome(); return;
      case "resetNo": S.confirmReset=false; renderHome(); return;
      case "resetYes": drop(KEY_HIST); drop(KEY_RUN); S.confirmReset=false; renderHome(); return;
    }
    return;
  }
  if(S.view==="exam"){
    const list=curList(); const q=list[S.idx];
    if(t.dataset.go!==undefined){S.idx=+t.dataset.go;S.focus="#qtext";renderExam();return}
    if(t.dataset.opt!==undefined){const i=+t.dataset.opt;
      if(q.type==="mc") S.answers[q.id]=i;
      else{const a=new Set(S.answers[q.id]||[]);a.has(i)?a.delete(i):a.add(i);S.answers[q.id]=[...a]}
      S.focus=`[data-opt="${i}"]`;renderExam();return}
    if(t.dataset.hot!==undefined){S.answers[q.id]=+t.dataset.hot;S.focus=`[data-hot="${+t.dataset.hot}"]`;renderExam();return}
    if(t.dataset.up!==undefined||t.dataset.down!==undefined){const a=S.answers[q.id];const up=t.dataset.up!==undefined;const i=+(up?t.dataset.up:t.dataset.down);const j=up?i-1:i+1;[a.order[i],a.order[j]]=[a.order[j],a.order[i]];a.touched=true;
      const n=a.order.length;S.focus=up?(j>0?`[data-up="${j}"]`:`[data-down="${j}"]`):(j<n-1?`[data-down="${j}"]`:`[data-up="${j}"]`);renderExam();return}
    if(t.dataset.ck){calcPress(t.dataset.ck);return}
    switch(t.id){
      case "prevBtn": S.idx--; S.focus="#qtext"; renderExam(); break;
      case "nextBtn": S.idx++; S.focus="#qtext"; renderExam(); break;
      case "flagBtn": S.flags[q.id]=!S.flags[q.id]; S.focus="#flagBtn"; renderExam(); break;
      case "finishBtn": askFinish(); break;
      case "confirmFinish": finishSection(); break;
      case "cancelFinish": document.getElementById("confirmBox").innerHTML=""; break;
      case "calcBtn": S.calcOpen=!S.calcOpen; S.focus=S.calcOpen?'[data-ck="7"]':"#calcBtn"; renderExam(); break;
      case "calcClose": S.calcOpen=false; S.focus="#calcBtn"; renderExam(); break;
      case "exitBtn": saveRun(); renderHome(); window.scrollTo(0,0); break;
    }
    return;
  }
  if(S.view==="break"&&t.id==="endBreak"){S.qi++;beginSection();return}
  if(S.view==="results"){
    if(t.dataset.filter){S.filter=t.dataset.filter;renderResults();return}
    if(t.id==="homeBtn"){renderHome();window.scrollTo(0,0)}
  }
});
app.addEventListener("change",e=>{if(e.target.id==="timedToggle") S.timed=e.target.checked});

try{ renderHome(); }
catch(err){
  /* Saved data this version can't read: clear it and start fresh instead of showing a blank page. */
  drop(KEY_HIST); drop(KEY_RUN);
  renderHome();
}
})();
</script>
</body>
